<!DOCTYPE html>

<head>

<title>Grand Prix des Plaines – Course de chevaux</title><!-- v-cotes -->
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Barlow+Condensed:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1f17;--felt:#14402e;--felt2:#1a5238;--brass:#e3b04b;--ink:#f6efe0;--red:#d6392f;--dim:#9db8a8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.machine{width:100%;max-width:480px;padding:12px 12px 24px}
h1{font:400 28px/1.1 Rye,Georgia,serif;color:var(--brass);text-align:center;margin:6px 0 2px}
.sub{text-align:center;color:var(--dim);margin:0 0 10px}

.bulbs{display:flex;justify-content:space-between;padding:0 4px;margin:6px 0}

.run .bulbs i{animation:blink .5s infinite alternate}

@keyframes blink{to{background:var(--brass);box-shadow:0 0 8px var(--brass)}}

.track{margin:10px 0;background:var(--felt);border:3px solid var(--brass);border-radius:8px;overflow:hidden;position:relative}
canvas{display:block;width:100%}
.lane{position:relative;height:46px;border-bottom:2px dashed rgba(246,239,224,.25);background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(0,0,0,.08) 38px 76px)}
.lane:last-child{border-bottom:0}
.lane:nth-child(even){background-color:var(--felt2)}
.fin{position:absolute;right:0;top:0;bottom:0;width:12px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/12px 12px;z-index:1}
.start{position:absolute;left:36px;top:0;bottom:0;border-left:2px solid rgba(246,239,224,.4)}
.horse{position:absolute;left:16px;top:5px;display:flex;align-items:center;gap:2px;will-change:transform;z-index:2}

.dust{position:absolute;left:-16px;bottom:2px;font-size:14px;opacity:0}
.run .emo{animation:gallop .3s ease-in-out infinite alternate}
.run .dust{animation:puff .35s linear infinite}
.run .lane{animation:scroll .35s linear infinite}

.types{display:flex;gap:6px;overflow-x:auto;margin:12px 0 8px;padding-bottom:4px}
.types button{flex:none;white-space:nowrap;min-height:40px;padding:0 12px;border-radius:20px;border:2px solid #2d5a45;background:#10291f;color:var(--ink);font:700 16px "Barlow Condensed",sans-serif;cursor:pointer}
.types button[aria-pressed=true]{background:var(--brass);color:#2a1d00;border-color:var(--brass)}
.pick .ord{background:var(--brass);color:#2a1d00;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-weight:700;font-size:14px}
.pick.out{grid-template-columns:1fr 1fr}.pick.out .nm{font-size:18px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{display:flex;align-items:center;gap:8px;text-align:left;background:#10291f;color:var(--ink);border:2px solid #2d5a45;border-radius:8px;padding:8px;font:inherit;min-height:48px;cursor:pointer}
.pick button[aria-pressed=true]{border-color:var(--brass);background:#2a3d1f;box-shadow:0 0 0 2px var(--brass) inset}

.pick .od{font-weight:700;font-size:20px;color:var(--brass)}
.row{display:flex;gap:8px;margin:12px 0;align-items:center}

.chip{min-width:52px;height:44px;border-radius:22px;border:2px dashed var(--brass);background:#6b2420;color:var(--ink);font:700 18px "Barlow Condensed",sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brass);color:#2a1d00;border-style:solid}
.go{width:100%;height:56px;border:0;border-radius:10px;background:var(--red);color:#fff;font:400 24px Rye,Georgia,serif;cursor:pointer;box-shadow:0 4px 0 #7d1d17}

.msg.win{color:var(--brass)}

:focus-visible{outline:3px solid #fff;outline-offset:2px}

.ov{position:fixed;inset:0;z-index:20;background:rgba(4,12,8,.82);display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}

.card{width:100%;max-width:420px;background:#10291f;border:3px solid var(--brass);border-radius:12px;padding:16px}

.chip:active:not(:disabled){transform:translateY(2px)}
.row b{font:400 30px/1 VT323,ui-monospace,monospace;color:#ffb347;margin-left:6px}

.sl{display:grid;grid-template-columns:1fr auto 34px;gap:8px;align-items:center;padding:6px 8px;background:#10291f;border:1px dashed #2d5a45;border-radius:6px;margin-bottom:4px}

.rv{position:fixed;inset:0;z-index:15;background:radial-gradient(ellipse at top,#16372a,#0b1f17 70%);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}

.rtrack{flex:1;min-height:0;position:relative}

.rbar{flex:none;max-height:38vh;overflow-y:auto;background:#06120d;border-top:3px solid var(--brass);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
#rst{color:var(--brass);font-size:22px;margin-bottom:4px}
.rb{display:grid;grid-template-columns:1fr auto;gap:10px;padding:3px 0;border-bottom:1px dashed #1d3f30;font-size:17px}
.rb.t{border:0;color:var(--dim)}
.track{display:none}
.tmr{display:flex;align-items:center;gap:10px;margin:10px 0 0;background:#06120d;border:2px solid #2d5a45;border-radius:6px;padding:6px 12px}
.tmr b{font:400 38px/1 VT323,ui-monospace,monospace;color:#7CFC9A;text-shadow:0 0 8px #3ad06a;min-width:2ch;text-align:right}
.tbar{flex:1;height:10px;background:#10291f;border-radius:5px;overflow:hidden}
#tb{height:100%;width:100%;background:#3ad06a}
.tmr.low b{color:#ff6a5a;text-shadow:0 0 8px #d6392f}.tmr.low #tb{background:#d6392f}
.tmr.off{opacity:.5}
.rk .ro{color:var(--brass);width:56px;text-align:right;font-weight:700}
.rk .ro.p{color:#c9d1d9;font-weight:600}
.rk li{font-size:17px;gap:6px}
.rkh{display:flex;justify-content:flex-end;color:var(--dim);font-size:13px;margin:0 8px 2px}
.rkh span{width:56px;text-align:right}
.gr{font:700 12px/1 "Barlow Condensed",sans-serif;font-style:normal;border-radius:4px;padding:2px 6px;margin-left:6px;color:#fff;vertical-align:1px}
.gA{background:#2faa5a}.gB{background:#8bc34a;color:#10291f}.gC{background:#e3b04b;color:#2a1d00}.gD{background:#e0702a}.gE{background:#d6392f}
.pick{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pick.hl{grid-template-columns:minmax(0,1fr)}
.hc{min-width:0}.hc .hb{min-width:0}
.pick .nm{min-width:0}
.row{flex-wrap:wrap}
#chips{gap:6px!important}
.chip{width:46px;height:46px;font-size:15px}
.row b{font-size:28px}
.ft{flex-wrap:wrap}
.vw{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:3;min-height:36px;padding:0 14px;border-radius:18px;border:2px solid var(--brass);background:rgba(6,18,13,.82);color:var(--ink);font:700 15px "Barlow Condensed",sans-serif;cursor:pointer}
.nm small.jk{color:#c9d1d9;font-size:13px}
.nm small.jk .gr{font-size:11px;padding:1px 5px;margin-left:5px}
.rk .nm2 small{display:block;color:var(--dim);font-size:13px;line-height:1.1}
.ft{flex-wrap:wrap}
</style>
</head>
<body>
<main class="machine" id="m">
  <h1 id="ttl">Grand Prix de Montréal</h1>
  <p class="sub"><span id="vinfo">Deux tours de piste.</span></p>
  <div class="bulbs" aria-hidden="true"></div>
  <div class="bank"><span>Jetons</span><b id="cr">0</b></div>
  <div class="tmr" id="tmr"><span>Paris ouverts</span><b id="tm">30</b><div class="tbar"><div id="tb"></div></div></div>
  <div class="track" id="trk"><canvas id="cv" aria-label="Piste ovale de 2 tours, ligne d’arrivée en bas au centre"></canvas></div>
  <div class="bulbs" aria-hidden="true"></div>
  <div class="types" id="types"></div>
  <div class="pick" id="pick"></div>
  <div class="pick hl" id="hl"></div>
  <div class="row"><span>Mise<b id="bv">25</b></span><div id="chips" style="display:flex;gap:8px"></div></div>
  <div class="slip" id="slip"></div>
  <button class="go sec" id="add">Ajouter au billet</button>
  <button class="go" id="go">Partez !</button>
  <div class="msg" id="msg" aria-live="polite">Aucun cheval choisi.</div>
  <div class="ft"><button id="rules">Règlements et statistiques</button><button id="mute">Son activé</button><button id="voice">Voix activée</button><button id="vsel">Voix</button></div>
  <p class="dim" style="text-align:center;margin-top:10px">Jetons fictifs, aucun argent réel.</p>
</main>
<div class="rv" id="rv"><div class="rtrack" id="rtrack"><button id="tel" class="telb">Télémétrie</button></div><div class="rbar"><div id="rst"></div><div id="rb"></div></div></div>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ovt"><div class="card" id="card"></div></div>
<script>
let NAMES=[];
const HPOOLS={mtl:["Poutine Express","Caribou","Tempête du Nord","Fleur de Lys","Maple Rocket","Tuque Dorée","Blizzard","Carnaval","Cabane à Sucre","Saint-Laurent","Éclair Noir","Mont-Royal","Aurore Boréale","Bonhomme","Vieux-Port","Orignal","Sirop d’Érable","Joual","Lac Saint-Jean","Rocher Percé","Tuque Bleue","Grand Nord","Petit Train","Fier Coureur"],
 tyo:["Sakura Kaze","Fuji Thunder","Shinjuku Star","Kaminari","Tokyo Dream","Ryu no Hikari","Hayate","Shogun Blue","Kintsugi","Momiji Run","Sumo Express","Yozora","Taiyo Maru","Neon Ginza","Samurai Spirit","Hanabi"],
 la:["Sunset Blvd","Hollywood Gold","Pacific Breeze","Malibu Wave","Santa Monica","Golden Coast","Silver Screen","Venice Beach","Desert Wind","Mulholland","Star Power","Palm Canyon","Canyon Fire","Big Sur","Rodeo Drive","Laurel Canyon"],
 ny:["Empire Express","Broadway Star","Brooklyn Bridge","Big Apple","Central Park","Harlem Nights","Manhattan Gold","Liberty Belle","Hudson River","Times Square","Wall Street","Coney Island","Queens Ruler","Bronx Thunder","Fifth Avenue","Yellow Cab"],
 tor:["Maple Leaf","Lake Ontario","CN Flyer","Yonge Street","Northern Lights","Don Valley","Scarborough","Blue Jay","Muskoka","Raptor Run","Casa Loma","Toronto Belle","Humber Wind","Distillery","Kensington","Queen West"],
 mel:["Southern Cross","Yarra River","Koala Express","Roo Runner","Boomerang","Outback Star","Great Ocean","Aussie Gold","Wattle Bloom","St Kilda","Flinders Lane","Dingo Dash","Eucalyptus","Spring Carnival","Bush Ranger","Coral Sea"],
 dxb:["Desert Falcon","Golden Dune","Burj Star","Oasis Prince","Sand Storm","Royal Emir","Arabian Night","Gulf Pearl","Mirage","Sultan's Pride","Palm Jumeirah","Shamal Wind","Saffron Sky","Gold Souk","Al Fajr","Desert Rose"],
 par:["Arc de Lumière","Belle Époque","Champs-Élysées","Rive Gauche","Montmartre","Croissant d’Or","Tour de Force","Bastille","Lutèce","Pont Neuf","Marais","Joie de Vivre","Saint-Germain","Bonne Chance","Opéra Garnier","Vent de Seine"],
 qc:["Frontenac","Plaines d’Abraham","Vieux-Québec","Cap Diamant","Petit Champlain","Île d’Orléans","Chute Montmorency","Traversier","Fleur de Neige","Remparts","Saint-Roch","Limoilou","Grande Allée","Beauport","Charlevoix","Fleuve Fier"],
 rom:["Gladiatore","Colosseo","Trevi","Imperatore","Lupa","Via Appia","Dolce Vita","Tevere","Palatino","Centurione","Vento d’Oro","Stella di Roma","Trastevere","Notte Romana","Augusto","Cesare"]};
const POOL=[].concat(...Object.values(HPOOLS)),POOLV=[].concat(...Object.keys(HPOOLS).map(k=>HPOOLS[k].map(()=>k)));
const COLS=["#d6392f","#2f6fd6","#c99a10","#2faa5a","#8a4fd0","#e0702a"],SEC=["#f4f4f4","#f2c230","#1b1b1b","#f4f4f4","#f2c230","#1e2a44"];
let SIDEC=null,ANA=false,tEnd=0,tmr=0,lastL=-1,GAPU=3,RV=0,NB=null,CR=null,TRK=null,TRKK="",VIEW="side",inRV=false,PIPC=null,PHS=[0,0,0,0,0,0],VOICE=null,voiceOn=true,CM=null;
const COAT=["#6b3e1f","#8a5a2b","#3b2a1f","#a8743f","#2c2520","#9b6a3c"],COATD=["#3d2210","#55351a","#1d140e","#6e4a26","#120e0b","#5f4125"];
const CHIPS=[5,25,100,500],MAXB=500,MAXN=6,MARGIN={win:.83,place:.83,ex:.8,qu:.8,tri:.75,par:.9,pg:.9};
const TYPES=[{id:"win",l:"Gagnant",n:1},{id:"place",l:"Placé (top 3)",n:1},{id:"ex",l:"Couplé ordre",n:2},{id:"qu",l:"Couplé désordre",n:2},{id:"tri",l:"Trifecta",n:3},{id:"par",l:"Pair / Impair",n:1,out:["Pair (2, 4, 6)","Impair (1, 3, 5)"]},{id:"pg",l:"Petits / Grands",n:1,out:["Petits (1 à 3)","Grands (4 à 6)"]}];
const SIMS=800;
let FIN=200,LAPS=2;let cur=[],LAT=[0,1,2,3,4,5],moving=false,G;
let credits=1000,bet=0,ti=0,picks=[],racing=false,str=[],W,P,EX,TR,bets=[],cd="",ST={n:0,stk:0,ret:0,best:0},mute=false,hoof,AC;
try{const v=parseInt(localStorage.getItem("hc_credits"));if(v>=0)credits=v}catch(e){}
try{Object.assign(ST,JSON.parse(localStorage.getItem("hc_st")))}catch(e){}
function saveST(){try{localStorage.setItem("hc_st",JSON.stringify(ST))}catch(e){}}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem("hc_credits",credits)}catch(e){}}
function step(h){h.m+=(Math.random()-.5)*.046-h.m*.06;const f=h.pos>FIN?Math.max(.35,1-(h.pos-FIN)/18):1;h.pos+=Math.max(.02,h.s*.11+h.m)*(1-.006*h.lat)*f}
function drift(hs){for(const h of hs)if(h.pos>=25&&h.lat>0)h.lat=Math.max(0,h.lat-.015)}
function clear(h,l,hs,m){
  const lo=Math.min(h.lat,l),hi=Math.max(h.lat,l),w=GAPU*(m||.98);
  return hs.every(j=>{
    if(j===h||Math.abs(j.pos-h.pos)>=w)return true;
    const a=Math.min(j.lat,j.tl),z=Math.max(j.lat,j.tl);
    return Math.max(lo-z,a-hi)>=.97;
  });
}
function lanes(hs){
  const ord=hs.slice().sort((a,b)=>b.pos-a.pos);
  for(const h of ord){
    let b=null;
    for(const j of hs)if(j!==h&&j.pos>h.pos&&j.pos-h.pos<GAPU*1.3&&Math.abs(j.lat-h.lat)<.97&&(!b||j.pos<b.pos))b=j;
    if(b){if(b.pos-h.pos<GAPU)h.pos=b.pos-GAPU;h.stuck++}else h.stuck=0;
    h.wait=(h.wait||0)-1;h.t=(h.t||0)+1;
    if(h.pos>=25&&h.pos<FIN-6&&Math.abs(h.tl-h.lat)<.05&&h.wait<=0){
      const inn=Math.round(h.tl)-1;
      const ahead=hs.some(j=>j!==h&&j.pos>h.pos&&j.pos-h.pos<GAPU*2.4&&(Math.abs(j.lat-inn)<.97||Math.abs(j.tl-inn)<.97)&&j.s<h.s+.01);
      if(inn>=0&&!ahead&&clear(h,inn,hs,1.3)){h.tl=inn;h.wait=30;h.tin=h.t}
      else if(b&&h.stuck>10&&h.s>b.s+.006&&h.t-(h.tin||-999)>300){
        for(const l of [Math.round(b.lat)-1,Math.round(b.lat)+1])if(l>=0&&l<=5&&clear(h,l,hs,1.1)){h.tl=l;h.stuck=0;h.wait=60;break}
      }
    }
    h.lat+=Math.max(-.04,Math.min(.04,h.tl-h.lat));
  }
}
function cross(hs,done){
  if(!hs.some(h=>h.pos>=FIN))return;
  hs.map((h,i)=>i).filter(i=>hs[i].pos>=FIN&&!done.includes(i)).sort((a,b)=>hs[b].pos-hs[a].pos).forEach(i=>done.push(i));
}
function sim(st){
  const hs=st.map((s,i)=>({s,m:0,pos:0,lat:i})),done=[];
  for(let t=0;t<FIN*26;t++){hs.forEach(step);drift(hs);cross(hs,done);if(done.length>=3)return done.slice(0,3)}

function assignJ(){JK=shuf(jv(V.id)).slice(0,6)}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function record(ids,o,no){o.forEach((lane,k)=>{const h=H[ids[lane]];h.h.push([no,k+1]);if(h.h.length>100)h.h.shift();h.last=no})}
function raceSim(st){
  const hs=st.map((s,i)=>({s,m:0,pos:0,lat:i})),done=[];
  for(let t=0;t<FIN*26&&done.length<6;t++){hs.forEach(step);drift(hs);cross(hs,done)}
  hs.forEach((h,i)=>{if(!done.includes(i))done.push(i)});return done;
}
function seed(){
  H=POOL.map((n,i)=>({n,v:POOLV[i],s:.935+Math.random()*.13,h:[],last:-99}));makeJ();
  for(let r=1;r<=900;r++){const vd=VIDS[r%VIDS.length],ids=shuf(hv(vd)).slice(0,6),js=shuf(jv(vd)).slice(0,6),o=raceSim(ids.map((i,k)=>H[i].s+J[js[k]].s+(Math.random()-.5)*.03));record(ids,o,r);recordJ(js,o,r)}
  raceNo=900;saveH();
}
function seedJ(){
  makeJ();
  for(let r=1;r<=600;r++){const vd=VIDS[r%VIDS.length],ids=shuf(hv(vd)).slice(0,6),js=shuf(jv(vd)).slice(0,6),o=raceSim(ids.map((i,k)=>H[i].s+J[js[k]].s+(Math.random()-.5)*.03));recordJ(js,o,raceNo-600+r)}
}
function saveH(){try{localStorage.setItem("hc_v2",JSON.stringify({H,J,jk:JK,no:raceNo,lu:lineup,luv:LUV}))}catch(e){}}
function nextLineup(){
  const pool=hv(V.id);let lu=(LUV[V.id]||[]).filter(i=>pool.includes(i));
  if(lu.length!==6)lu=shuf(pool).slice(0,6);
  else{const k=1+(Math.random()*3|0),keep=shuf(lu).slice(0,6-k),bench=pool.filter(i=>!lu.includes(i)).sort((a,b)=>H[a].last-H[b].last).slice(0,7);lu=shuf(keep.concat(shuf(bench).slice(0,k)))}
  LUV[V.id]=lu;return lineup=lu;
}
function avg10(id){const L=H[id].h.slice(-10);return L.length?L.reduce((a,x)=>a+x[1],0)/L.length:3.5}
function grade(id){const a=avg10(id);return a<2.7?"A":a<3.2?"B":a<3.8?"C":a<4.3?"D":"E"}
function gradeH(id){return gradeA(avg10(id))}
function est(id){
  let sw=0,sp=0;
  H[id].h.slice(-10).reverse().forEach((x,k)=>{const w=Math.pow(.85,k);sw+=w;sp+=w*x[1]});
  return .93+.14*(6-(sp+3.5*1.5)/(sw+1.5))/5;
}
function info(i){
  const h=H[lineup[i]],L=h.h,n=L.length,c=k=>L.filter(x=>x[1]<=k).length;
  const avg=a=>a.length?(a.reduce((s,x)=>s+x[1],0)/a.length).toFixed(1):"–",pc=k=>n?Math.round(100*c(k)/n)+" %":"–";
  const bars=L.map(x=>`<i style="height:${(7-x[1])/6*100}%;background:${x[1]==1?"#e3b04b":x[1]<=3?"#2faa5a":"#4a6a5a"}"></i>`).join("");
  const rows=L.slice().reverse().map(x=>`<li><span>Course n° ${x[0]}</span><b>${x[1]==1?"1er":x[1]+"e"} sur 6</b></li>`).join("");
  const jk=JK[i],jj=J[jk],jc=jCareer(jk),jh=jj.h,jw=jh.filter(x=>x[1]===1).length,je=jEst(jk),inf=je>.004?"favorable (cote plus basse)":je<-.004?"défavorable (cote plus haute)":"neutre";
  const jb=`<h2 style="font-size:18px;margin:10px 0 4px">Jockey : ${jj.n} <i class="gr g${jGrade(jk)}">${jGrade(jk)}</i></h2><div class="rc"><div><span>Expérience</span><b>${jc} courses${jc<60?" (apprenti)":jc>=800?" (vétéran)":""}</b></div><div><span>Victoires (100 dernières)</span><b>${jw}${jh.length?" / "+jh.length:""}</b></div><div><span>Moyenne des 10 dernières</span><b>${jh.length?jAvg(jk,10).toFixed(1):"–"}</b></div><div><span>Influence sur la cote</span><b>${inf}</b></div></div>`;
  $("card").innerHTML=`<h2 id="ovt">${h.n} <i class="gr g${grade(lineup[i])}">${grade(lineup[i])}</i></h2><div class="rc"><div><span>Cote gagnant</span><b>×${od("win",[i])}</b></div><div><span>Courses</span><b>${n}</b></div><div><span>Victoires</span><b>${c(1)} (${pc(1)})</b></div><div><span>Podiums</span><b>${c(3)} (${pc(3)})</b></div><div><span>Place moyenne</span><b>${avg(L)}</b></div><div><span>Moyenne des 10 dernières</span><b>${avg(L.slice(-10))}</b></div><div><span>Surface préférée</span><b>${(spf(lineup[i]),Math.abs(h.pf)<.003?"indifférent":h.pf>0?"gazon":"terre")}${V.surf!=="synthétique"&&Math.abs(h.pf)>=.003?(spf(lineup[i])>0?" ✓ avantagé ici":" ✗ désavantagé ici"):""}</b></div></div>${jb}<div class="bars" aria-hidden="true">${bars}</div><small class="dim">Du plus ancien au plus récent. Barre haute : bonne place, dorée : victoire.</small><ul class="hist">${rows}</ul><button class="go" id="cl">Fermer</button>`;
  $("ov").classList.add("on");$("cl").focus();$("cl").onclick=()=>$("ov").classList.remove("on");
}
try{const j=JSON.parse(localStorage.getItem("hc_v2"));const okH=j&&j.H&&j.H.length&&j.H.length<=POOL.length&&j.H.every((h,i)=>h.n===POOL[i]&&h.v===POOLV[i]);
  if(okH){H=j.H;raceNo=j.no;lineup=j.lu||[];LUV=j.luv||{};
    const okJ=j.J&&j.J.length<=JPOOL.length&&j.J.every((x,i)=>x.n===JPOOL[i]);
    if(okJ){J=j.J;JK=j.jk||JK;const nv=new Set();for(let i=H.length;i<POOL.length;i++){H.push({n:POOL[i],v:POOLV[i],s:.935+Math.random()*.13,h:[],last:-99});nv.add(POOLV[i])}for(let i=J.length;i<JPOOL.length;i++){J.push(mkJ(JPOOL[i],i));nv.add(JPOOLV[i])}
      const vs=[...nv];if(vs.length){const N=vs.length*120;for(let r=1;r<=N;r++){const vd=vs[r%vs.length],ids=shuf(hv(vd)).slice(0,6),js=shuf(jv(vd)).slice(0,6),o=raceSim(ids.map((i,k)=>H[i].s+J[js[k]].s+(Math.random()-.5)*.03));record(ids,o,raceNo-N+r);recordJ(js,o,raceNo-N+r)}saveH()}}
    else if(H.length===POOL.length)seedJ();else H=[]}}catch(e){}
if(!H.length)seed();
$("tel").onclick=()=>{TEL=!TEL;$("tel").textContent=TEL?"Caméras":"Télémétrie";$("tel").classList.toggle("on",TEL);paint(performance.now())};$("add").onclick=()=>addBet();$("rules").onclick=rules;$("vsel").onclick=cycleVoice;pickVoice();$("voice").onclick=()=>{voiceOn=!voiceOn;if(!voiceOn)stopSpeech();$("voice").textContent=voiceOn?"Voix activée":"Voix coupée"};
$("cv").addEventListener("click",e=>{const R=window._inset;if(!inRV||!R)return;const b=$("cv").getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;if(x>=R[0]-6&&x<=R[0]+R[2]+6&&y>=R[1]-6&&y<=R[1]+R[3]+6){VIEW=VIEW==="top"?"side":"top";paint(performance.now())}});
$("mute").onclick=()=>{mute=!mute;if(mute){crowdOff();stopSpeech()}$("mute").textContent=mute?"Son coupé":"Son activé"};
document.querySelectorAll(".bulbs").forEach(b=>b.innerHTML="<i></i>".repeat(16));
